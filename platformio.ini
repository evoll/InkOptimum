lib_deps =
  ${base.lib_deps}
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
build_flags =
  ${base.build_flags}
  -UFREEINK_DEVICE_X4
  -UFREEINK_DEVICE_X3
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  ; FreeType auto-hinter: keeps thin strokes intact in the 2-bit/BW quantizer
  -DFREEINK_FONT_ENABLE_AUTOHINT=1
  ; OpenType CFF (.otf with PostScript outlines)
  -DFREEINK_FONT_ENABLE_CFF=1
  -DUSB_PRODUCT=\"inkMOD_X4_Pro\"
  -DUSB_MANUFACTURER=\"inkMOD\"
  -DINKMOD_VERSION=\"${inkmod.version}\"
  -DINKMOD_FIRMWARE_VARIANT=\"x4pro\"
  -DUSE_NEW_READER=0
  -DLOG_LEVEL=-1
  -DNDEBUG
  -DUSE_BLOCK_DEVICE_INTERFACE=1


