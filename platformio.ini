; BLE page-turner radio (NimBLE central through freeink-sdk BleKeyboardHost). The SDK has no other BLE
; backend: BleKeyboardHost is itself the NimBLE wrapper, so there is nothing to choose instead of NimBLE.
; Opt-in: build an env that extends one of the base envs plus this section (see x4pro-ble below).
; custom_sdkconfig makes pioarduino rebuild the Arduino libs (central-only, one link, small pools).
[ble_page_turner]
custom_sdkconfig =
  CONFIG_BT_ENABLED=y
  CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=n
  CONFIG_BT_NIMBLE_ROLE_BROADCASTER=n
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  CONFIG_BT_NIMBLE_MAX_BONDS=4
  CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=23
  CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=4096
  CONFIG_BT_CTRL_BLE_MAX_ACT=4
  CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=12
  CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=12
  CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=8
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
build_flags =
  -DFREEINK_CAP_BLE_HID_HOST=1
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
  ; NimBLE host in PSRAM on boards that have it (BOARD_HAS_PSRAM).
  -include scripts/s3_nimble_psram.h

; X4 Pro and X4 Classic (ESP32-S3, PSRAM): same recipe. The rebuilt core must keep the TinyUSB component, or USB
; drive mode (FREEINK_CAP_USB_MSC) is lost; CrossPoint keeps USB-MSC profiles on the prebuilt core for that reason.
; Here the prebuilt core cannot be used (it already contains a NimBLE host and the link fails with duplicate symbols
; once NimBLE-Arduino is added), so check on a device that USB drive still works before trusting these envs.
[env:x4pro-ble]
extends = env:x4pro-release
lib_deps =
  ${env:x4pro-release.lib_deps}
  ${ble_page_turner.lib_deps}
build_flags =
  ${env:x4pro-release.build_flags}
  ${ble_page_turner.build_flags}
custom_sdkconfig = ${ble_page_turner.custom_sdkconfig}

[env:x4classic-ble]
extends = env:x4classic-release
lib_deps =
  ${env:x4classic-release.lib_deps}
  ${ble_page_turner.lib_deps}
build_flags =
  ${env:x4classic-release.build_flags}
  ${ble_page_turner.build_flags}
custom_sdkconfig = ${ble_page_turner.custom_sdkconfig}

; X3/X4 (ESP32-C3, no PSRAM): the only place BLE costs real heap. Same recipe as CrossPoint's firmware_tuned_c3:
; flash-only controller archive (patch_arduino_ble_controller.py picks libbtdm_app_flash.a to match), ROM libc.
; Tight on RAM: RadioPolicy kX3Profile gates the radio on heap, stack 49,152 B + 32 KiB largest block.
[env:x3x4-ble]
extends = env:x3x4-release
lib_deps =
  ${env:x3x4-release.lib_deps}
  ${ble_page_turner.lib_deps}
build_flags =
  ${env:x3x4-release.build_flags}
  ${ble_page_turner.build_flags}
extra_scripts =
  ${env:x3x4-release.extra_scripts}
  post:scripts/patch_arduino_ble_controller.py
custom_sdkconfig =
  ${ble_page_turner.custom_sdkconfig}
  CONFIG_BT_CTRL_RUN_IN_FLASH_ONLY=y
  CONFIG_LIBC_OPTIMIZED_MISALIGNED_ACCESS=n
