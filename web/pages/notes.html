<div class="card">
  <h2 data-i18n="notes.title">Bookmarks &amp; Clippings</h2>
  <p class="hint" data-i18n="notes.intro">Everything you saved while reading. Export to Markdown or JSON, rename favourite pages or delete entries.</p>
  <div class="nt-toolbar">
    <input type="text" id="ntFilter" data-i18n-placeholder="notes.filter_ph" placeholder="Filter books" />
    <button class="btn" id="ntExportAll" data-i18n="notes.export_all">Export everything (MD)</button>
    <button class="btn" id="ntExportAllJson" data-i18n="notes.export_all_json">Export everything (JSON)</button>
  </div>
  <div id="ntStatus" class="hint"></div>
  <div id="ntBooks"></div>
</div>
