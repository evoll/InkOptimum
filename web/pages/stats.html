<div class="card">
  <h2 data-i18n="stats.title">Reading statistics</h2>
  <div class="st-grid" id="stSummary"></div>
  <p class="hint" id="stEmpty" style="display:none" data-i18n="stats.empty">No reading data yet.</p>
</div>
<div class="card">
  <h2 data-i18n="stats.activity">Reading days</h2>
  <div class="st-heat" id="stHeat"></div>
  <p class="hint" data-i18n="stats.heat_hint">Last 26 weeks; filled squares are days with reading.</p>
</div>
<div class="card">
  <h2 data-i18n="stats.when">When you read</h2>
  <div class="st-bars" id="stDow"></div>
  <div class="st-bars" id="stTod"></div>
</div>
